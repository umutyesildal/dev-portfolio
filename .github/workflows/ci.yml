name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:check
      - name: Check example profile
        run: pnpm profile:check
        env:
          PORTFOLIO_CONTENT_FILE: examples/umut-portfolio.yaml
      - name: Check sample profile
        run: pnpm profile:check
        env:
          PORTFOLIO_CONTENT_FILE: examples/sample-designer.yaml
      - run: pnpm audit --prod --audit-level high
      - name: Build default template
        run: pnpm build
      - name: Build example profile
        run: pnpm build
        env:
          PORTFOLIO_CONTENT_FILE: examples/umut-portfolio.yaml
      - name: Build sample profile
        run: pnpm build
        env:
          PORTFOLIO_CONTENT_FILE: examples/sample-designer.yaml
